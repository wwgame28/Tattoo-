<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ORLICA · Записи</title><style>
:root{--bg:#0e0e0f;--panel:#171719;--line:#303033;--text:#f1f0eb;--muted:#8f8f94;--ok:#b9d6a3;--bad:#efaaaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Inter",Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 24px));margin:auto;padding:24px 0 80px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:28px}h1{font-size:clamp(36px,9vw,76px);line-height:.86;letter-spacing:-.05em;margin:0}header span{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}.login,.card,.create{border:1px solid var(--line);background:var(--panel);padding:18px}.login{max-width:520px;margin:16vh auto}.login input,.create input,.create select{width:100%;background:#0d0d0e;border:1px solid var(--line);color:#fff;padding:14px;font-size:16px;margin-top:8px}.btn{border:0;background:#f1f0eb;color:#111;padding:13px 16px;font:inherit;font-weight:800;cursor:pointer}.btn.dark{background:#262629;color:#fff}.btn.bad{background:#3a1818;color:#ffc2c2}.btn.ok{background:#dfead7;color:#111}.login .btn{margin-top:12px;width:100%}.error{color:#ffb3b3;font-size:13px;margin-top:12px}.app{display:none}.app.show{display:block}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}.stat{border:1px solid var(--line);padding:16px}.stat b{display:block;font-size:28px}.stat span{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.12em}.create{display:grid;grid-template-columns:1fr 120px 1fr auto;gap:10px;align-items:end;margin-bottom:28px}.create label{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}h2{font-size:23px;margin:34px 0 14px}.list{display:grid;gap:10px}.slot,.booking{border:1px solid var(--line);padding:15px;display:grid;gap:12px}.slot{grid-template-columns:1fr auto;align-items:center}.meta{color:var(--muted);font-size:12px;line-height:1.45}.status{display:inline-block;padding:5px 8px;border:1px solid var(--line);font-size:9px;text-transform:uppercase;letter-spacing:.1em;margin-left:8px}.actions{display:flex;flex-wrap:wrap;gap:7px}.actions .btn{padding:9px 11px;font-size:12px}.booking-head{display:flex;justify-content:space-between;gap:12px}.booking strong{font-size:18px}.idea{white-space:pre-wrap;color:#ddd;line-height:1.5}.contact a{color:#fff}.empty{padding:24px;border:1px dashed var(--line);color:var(--muted)}.sketch-card{display:grid;grid-template-columns:130px 1fr;gap:14px;align-items:center;color:#fff;text-decoration:none;border:1px solid var(--line);background:#111;padding:10px}.sketch-card img{display:block;width:130px;height:130px;object-fit:cover;background:#090909}.sketch-card span{font-size:12px;letter-spacing:.1em;text-transform:uppercase}.sketch-card small{display:block;color:var(--muted);margin-top:5px;text-transform:none;letter-spacing:0}.reference-link{color:#ddd;text-decoration:underline;text-underline-offset:3px}@media(max-width:720px){.create{grid-template-columns:1fr 1fr}.create label:nth-child(3){grid-column:1/-1}.create .btn{grid-column:1/-1}.slot{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr 1fr}.booking-head{display:block}.booking-head .status{margin:8px 0 0}}@media(max-width:420px){.stats{grid-template-columns:1fr}.wrap{width:calc(100% - 16px)}.sketch-card{grid-template-columns:96px 1fr}.sketch-card img{width:96px;height:96px}}
</style><link rel="stylesheet" href="admin-v9.css?v=9">
<link rel="stylesheet" href="admin-v101.css?v=1012"></head><body><div class="wrap"><div id="login" class="login"><h1>ORLICA<br>ADMIN</h1><p class="meta">Управление свободными окнами и заявками. Ключ хранится только на этом устройстве.</p><input id="token" type="password" autocomplete="off" placeholder="Ключ доступа"><button id="login-btn" class="btn">Открыть админку</button><div id="login-error" class="error"></div></div><div id="app" class="app"><header><div><h1>ЗАПИСИ</h1><span>ORLICA TATT / LIVE</span></div><button class="btn dark" id="logout">Выйти</button></header><div class="stats"><div class="stat"><b id="stat-open">0</b><span>свободно</span></div><div class="stat"><b id="stat-pending">0</b><span>ждут</span></div><div class="stat"><b id="stat-confirmed">0</b><span>подтверждено</span></div></div><form id="create" class="create"><label>Дата и время<input id="starts" type="datetime-local" required></label><label>Длительность<select id="duration"><option value="120">2 часа</option><option value="180" selected>3 часа</option><option value="240">4 часа</option><option value="300">5 часов</option><option value="360">6 часов</option></select></label><label>Заметка<input id="note" maxlength="120" placeholder="Напр. маленькая работа"></label><button class="btn" type="submit">+ Открыть окно</button></form><h2>Календарь</h2><div id="slots" class="list"></div><h2>Заявки</h2><div id="bookings" class="list"></div></div></div><script>
(()=>{const ENDPOINT='https://dbwnvbfdphqmfjzbpqnw.supabase.co/functions/v1/orlica-admin',TZ='Asia/Yakutsk';let token='';const $=s=>document.querySelector(s),login=$('#login'),app=$('#app'),err=$('#login-error');function takeHash(){let h=location.hash.slice(1);if(h.startsWith('token='))h=decodeURIComponent(h.slice(6));if(h&&h.length>20){localStorage.setItem('orlica_admin_token',h);history.replaceState(null,'',location.pathname);return h}return localStorage.getItem('orlica_admin_token')||''}async function call(action,data={}){const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json','x-admin-token':token},body:JSON.stringify({action,...data})});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Ошибка');return j}function fmt(iso){return new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(iso))}function statusRu(s){return({open:'свободно',pending:'ожидает',booked:'занято',closed:'закрыто',confirmed:'подтверждено',cancelled:'отменено',completed:'завершено'})[s]||s}async function load(){const {slots,bookings}=await call('state');$('#stat-open').textContent=slots.filter(s=>s.status==='open'&&new Date(s.starts_at)>new Date()).length;$('#stat-pending').textContent=bookings.filter(b=>b.status==='pending').length;$('#stat-confirmed').textContent=bookings.filter(b=>b.status==='confirmed').length;const future=slots.filter(s=>new Date(s.starts_at)>new Date());$('#slots').innerHTML=future.length?future.map(s=>`<div class="slot"><div><strong>${fmt(s.starts_at)}</strong><span class="status">${statusRu(s.status)}</span><div class="meta">${s.duration_minutes} мин${s.note?' · '+esc(s.note):''}</div></div><div class="actions">${s.status==='open'?`<button class="btn dark" data-slot="${s.id}" data-action="close">Закрыть</button>`:`<button class="btn ok" data-slot="${s.id}" data-action="open">Открыть</button>`}<button class="btn bad" data-slot="${s.id}" data-action="delete">Удалить</button></div></div>`).join(''):'<div class="empty">Открытых дат пока нет. Добавь первое окно выше.</div>';$('#bookings').innerHTML=bookings.length?bookings.map(b=>{const s=slots.find(x=>x.id===b.slot_id);return `<div class="booking"><div class="booking-head"><div><strong>${esc(b.client_name)}</strong><span class="status">${statusRu(b.status)}</span><div class="meta">${b.booking_code}${s?' · '+fmt(s.starts_at):''}</div></div><div class="contact"><a href="${linkContact(b.telegram||b.contact)}" target="_blank" rel="noopener">${esc(b.contact)} ↗</a></div></div><div class="idea"><b>${esc(b.tattoo_place)}</b>${b.tattoo_size?' · '+esc(b.tattoo_size):''}\n${esc(b.idea)}</div>${b.sketch_url?`<a href="${safeUrl(b.sketch_url)}" target="_blank" rel="noopener" class="sketch-card"><img src="${safeUrl(b.sketch_url)}" alt="Эскиз клиента"><span>Эскиз клиента<small>Нажми, чтобы открыть крупно</small></span></a>`:''}${b.reference_url?`<a href="${safeUrl(b.reference_url)}" target="_blank" rel="noopener" class="meta reference-link">Ссылка на референс ↗</a>`:''}<div class="actions">${b.status==='pending'?`<button class="btn ok" data-booking="${b.id}" data-status="confirmed">Подтвердить</button><button class="btn bad" data-booking="${b.id}" data-status="cancelled">Отменить</button>`:''}${b.status==='confirmed'?`<button class="btn dark" data-booking="${b.id}" data-status="completed">Завершить</button><button class="btn bad" data-booking="${b.id}" data-status="cancelled">Отменить</button>`:''}</div></div>`}).join(''):'<div class="empty">Заявок ещё нет.</div>';bind()}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}function linkContact(v){v=String(v||'').trim();if(v.startsWith('@'))return 'https://t.me/'+encodeURIComponent(v.slice(1));if(/^\+?[\d\s()-]{7,}$/.test(v))return 'tel:'+v.replace(/[^+\d]/g,'');return '#'}function bind(){document.querySelectorAll('[data-slot]').forEach(b=>b.onclick=async()=>{try{if(b.dataset.action==='delete'){if(!confirm('Удалить окно?'))return;await call('delete_slot',{id:b.dataset.slot})}else await call('set_slot_status',{id:b.dataset.slot,status:b.dataset.action==='open'?'open':'closed'});await load()}catch(e){alert(e.message)}});document.querySelectorAll('[data-booking]').forEach(b=>b.onclick=async()=>{try{await call('set_booking_status',{id:b.dataset.booking,status:b.dataset.status});await load()}catch(e){alert(e.message)}})}async function loginWith(v){token=v;try{await load();login.style.display='none';app.classList.add('show');err.textContent=''}catch(e){err.textContent='Ключ не подходит или сервис недоступен.';localStorage.removeItem('orlica_admin_token')}}$('#login-btn').onclick=()=>{const v=$('#token').value.trim();if(v)localStorage.setItem('orlica_admin_token',v);loginWith(v)};$('#logout').onclick=()=>{localStorage.removeItem('orlica_admin_token');location.reload()};$('#create').onsubmit=async e=>{e.preventDefault();const local=$('#starts').value;if(!local)return;try{await call('create_slot',{starts_at:new Date(local).toISOString(),duration_minutes:Number($('#duration').value),note:$('#note').value.trim()||null});$('#note').value='';await load()}catch(e){alert(e.message)}};const initial=takeHash();if(initial)loginWith(initial);})();
</script><script defer src="admin-v9.js?v=9"></script>
<script defer src="admin-v101.js?v=1012"></script></body></html>
