name: Materialize FrameGuide source

on:
  workflow_dispatch:
  push:
    branches: [frameguide-app]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: frameguide-app
          fetch-depth: 0

      - name: Expand full project source
        shell: bash
        run: |
          set -euo pipefail

          for part in archive/part-00 archive/part-01 archive/part-02 archive/part-03 archive/part-04; do
            if [ ! -f "$part" ]; then
              echo "Waiting for all archive parts; missing $part"
              exit 0
            fi
          done

          cat archive/part-00 archive/part-01 archive/part-02 archive/part-03 archive/part-04 > frameguide-full.tar.gz.b64
          base64 --decode frameguide-full.tar.gz.b64 > frameguide-full.tar.gz.new
          tar -tzf frameguide-full.tar.gz.new >/dev/null
          tar -xzf frameguide-full.tar.gz.new -C .

          rm -rf archive frameguide-full.tar.gz frameguide-full.tar.gz.new frameguide-full.tar.gz.b64 scripts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes."
            exit 0
          fi
          git commit -m "Materialize FrameGuide source"
          git push origin HEAD:frameguide-app
