name: Apply ORLICA V8
on:
  push:
    paths:
      - ".github/workflows/orlica-v8.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import gallery atlas and wire V8
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/works
          curl -L --fail --retry 3 "https://at.adobe.com/sPLNSHgJzaKdtbjB" -o assets/works/orlica-atlas.webp
          test -s assets/works/orlica-atlas.webp
          test "$(head -c 4 assets/works/orlica-atlas.webp)" = "RIFF"
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          css = '<link rel="stylesheet" href="orlica-v8.css?v=1">'
          js = '<script src="orlica-v8.js?v=1" defer></script>'
          if css not in s:
              s = s.replace('</head>', css + '\n</head>', 1)
          if js not in s:
              s = s.replace('</body>', js + '\n</body>', 1)
          p.write_text(s, encoding="utf-8")
          PY
          git config user.name "Danil Director Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html assets/works/orlica-atlas.webp
          git commit -m "Apply ORLICA V8 booking and portfolio" || exit 0
          git push
