name: ORLICA live smoke test

on:
  push:
    paths:
      - 'scripts/orlica-smoke.mjs'
      - '.github/workflows/orlica-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright WebKit
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps webkit
      - name: Run live mobile smoke test
        run: node scripts/orlica-smoke.mjs
      - name: Upload QA screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orlica-smoke-mobile
          path: orlica-smoke-mobile.png
          if-no-files-found: ignore
