name: Apply Orlica Director V5

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/orlica-director-v5.yml'
      - '.github/scripts/apply_director_patch.py'
      - 'director-v5.css'
      - 'director-v5.js'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Director V5 patch
        run: python .github/scripts/apply_director_patch.py

      - name: Commit patched index
        run: |
          if git diff --quiet -- index.html; then
            echo "index.html already patched"
            exit 0
          fi
          git config user.name "Danil Director Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Apply Danil Director V5 to index [director-patched]"
          git push
