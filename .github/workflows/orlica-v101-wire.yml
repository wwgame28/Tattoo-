name: Wire ORLICA V10.1
on:
  push:
    paths:
      - '.github/workflows/orlica-v101-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire V10.1 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="orlica-v101.css?v=1011">'
          js='<script defer src="orlica-v101.js?v=1011"></script>'
          if 'orlica-v101.css' not in s:
              s=s.replace('</head>',css+'</head>')
          else:
              s=s.replace('orlica-v101.css?v=101','orlica-v101.css?v=1011')
          if 'orlica-v101.js' not in s:
              s=s.replace('</body>',js+'</body>')
          else:
              s=s.replace('orlica-v101.js?v=101','orlica-v101.js?v=1011')
          p.write_text(s,encoding='utf-8')

          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="admin-v101.css?v=1011">'
          js='<script defer src="admin-v101.js?v=1011"></script>'
          if 'admin-v101.css' not in s:
              s=s.replace('</head>',css+'</head>')
          else:
              s=s.replace('admin-v101.css?v=101','admin-v101.css?v=1011')
          if 'admin-v101.js' not in s:
              s=s.replace('</body>',js+'</body>')
          else:
              s=s.replace('admin-v101.js?v=101','admin-v101.js?v=1011')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "Danil Director Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html admin.html
          if ! git diff --cached --quiet; then
            git commit -m "Refresh ORLICA V10.1 assets"
            git push
          fi
