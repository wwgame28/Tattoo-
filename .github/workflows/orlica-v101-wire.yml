name: Wire ORLICA V10.1
on:
  push:
    paths:
      - '.github/workflows/orlica-v101-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire V10.1 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          def wire_css(name, version):
              global s
              tag=f'<link rel="stylesheet" href="{name}?v={version}">'
              pattern=rf'{re.escape(name)}(?:\?v=[^"\']+)?'
              if name in s:
                  s=re.sub(pattern,f'{name}?v={version}',s)
              else:
                  s=s.replace('</head>',tag+'</head>')

          def wire_js(name, version):
              global s
              tag=f'<script defer src="{name}?v={version}"></script>'
              pattern=rf'{re.escape(name)}(?:\?v=[^"\']+)?'
              if name in s:
                  s=re.sub(pattern,f'{name}?v={version}',s)
              else:
                  s=s.replace('</body>',tag+'</body>')

          wire_css('orlica-v101.css','1012')
          wire_css('orlica-hero-hold.css','4')
          wire_css('orlica-hero-clean.css','2')
          wire_js('orlica-hero-hold.js','4')
          wire_js('orlica-v101.js','1012')
          p.write_text(s,encoding='utf-8')

          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="admin-v101.css?v=1012">'
          js='<script defer src="admin-v101.js?v=1012"></script>'
          if 'admin-v101.css' in s:
              s=re.sub(r'admin-v101\.css(?:\?v=[^"\']+)?','admin-v101.css?v=1012',s)
          else:
              s=s.replace('</head>',css+'</head>')
          if 'admin-v101.js' in s:
              s=re.sub(r'admin-v101\.js(?:\?v=[^"\']+)?','admin-v101.js?v=1012',s)
          else:
              s=s.replace('</body>',js+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "Danil Director Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html admin.html
          if ! git diff --cached --quiet; then
            git commit -m "Remove hero compare and hold scanner UI"
            git push
          fi
