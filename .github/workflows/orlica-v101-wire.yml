name: Wire ORLICA V10.1
on:
  push:
    paths:
      - '.github/workflows/orlica-v101-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire V10.1 assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="orlica-v101.css?v=101">'
          js='<script defer src="orlica-v101.js?v=101"></script>'
          if 'orlica-v101.css' not in s:
              s=s.replace('</head>',css+'</head>')
          if 'orlica-v101.js' not in s:
              s=s.replace('</body>',js+'</body>')
          p.write_text(s,encoding='utf-8')

          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="admin-v101.css?v=101">'
          js='<script defer src="admin-v101.js?v=101"></script>'
          if 'admin-v101.css' not in s:
              s=s.replace('</head>',css+'</head>')
          if 'admin-v101.js' not in s:
              s=s.replace('</body>',js+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name "Danil Director Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html admin.html
          if ! git diff --cached --quiet; then
            git commit -m "Apply ORLICA V10.1 UX polish"
            git push
          fi
