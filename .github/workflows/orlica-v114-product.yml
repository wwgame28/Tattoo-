name: Apply ORLICA V11.4 product layer

on:
  push:
    paths:
      - 'scripts/apply-v114-product.py'
      - '.github/workflows/orlica-v114-product.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire V11.4
        run: python scripts/apply-v114-product.py
      - name: Validate
        run: |
          test -s orlica-v114.css
          test -s orlica-v114.js
          grep -q 'orlica-v114.css?v=1140' index.html
          grep -q 'orlica-v114.js?v=1140' index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Enable ORLICA V11.4 product layer'
          git push
