name: Remove ORLICA V11.4 product layer

on:
  push:
    paths:
      - 'scripts/remove-v114-product.py'
      - '.github/workflows/orlica-v114-remove.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove V11.4 product layer
        run: python scripts/remove-v114-product.py
      - name: Validate removal
        run: |
          test -s index.html
          ! grep -q 'orlica-v114.css' index.html
          ! grep -q 'orlica-v114.js' index.html
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove ORLICA V11.4 product layer'
          git push
