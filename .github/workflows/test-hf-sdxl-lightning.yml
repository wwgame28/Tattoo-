name: Test HF SDXL Lightning

on:
  push:
    paths:
      - 'scripts/test-hf-sdxl-lightning.mjs'
      - '.github/workflows/test-hf-sdxl-lightning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Gradio client
        run: npm install --no-save @gradio/client
      - name: Test public SDXL Lightning Space
        run: node scripts/test-hf-sdxl-lightning.mjs
