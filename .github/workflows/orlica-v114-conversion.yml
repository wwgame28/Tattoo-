name: Apply ORLICA V11.4 conversion

on:
  push:
    paths:
      - 'scripts/apply-v114-conversion.py'
      - '.github/workflows/orlica-v114-conversion.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V11.4
        run: python scripts/apply-v114-conversion.py
      - name: Validate V11.4
        run: |
          test -s index.html
          test -s orlica-v11.css
          test -s orlica-v11.js
          grep -q 'ORLICA V11.4 conversion layer' orlica-v11.css
          grep -q 'ORLICA V11.4 conversion runtime' orlica-v11.js
          grep -q 'orlica-v11.css?v=1140' index.html
          grep -q 'orlica-v11.js?v=1140' index.html
      - name: Commit V11.4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html orlica-v11.css orlica-v11.js
          git diff --cached --quiet && exit 0
          git commit -m 'Add interactive portfolio and Telegram brief'
          git push
