name: Clean stale ORLICA contact

on:
  push:
    paths:
      - 'scripts/fix-stale-contact.py'
      - '.github/workflows/orlica-contact-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace stale Telegram handle
        run: python scripts/fix-stale-contact.py
      - name: Validate
        run: |
          ! grep -Rni --include='*.html' --include='*.js' --exclude-dir='.git' --exclude-dir='scripts' 'sveta_orlica' .
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html ./*.js
          git diff --cached --quiet && exit 0
          git commit -m 'Replace stale Telegram contact'
          git push
