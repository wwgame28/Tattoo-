name: MALABAR build pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/index.html'
      - 'frontend/src/**'
      - 'scripts/export-routes.mjs'
      - 'scripts/stage-pages.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/orlica-build-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: malabar-build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run stage:pages
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html 404.html app-assets about booking constructor faq flash lab prices process works
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build MALABAR site"
            git push
          fi
