name: Extract ORLICA hero snippet
on:
  push:
    paths:
      - '.github/workflows/extract-hero-snippet.yml'
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract hero markup and scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          needles=['ink-portrait','ink-toggle']
          chunks=[]
          for n in needles:
              i=s.find(n)
              if i>=0:
                  chunks.append(f'--- {n} ---\n'+s[max(0,i-1800):i+2600])
          Path('hero-snippet.txt').write_text('\n\n'.join(chunks),encoding='utf-8')
          PY
          git config user.name 'Danil Director Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add hero-snippet.txt
          git commit -m 'Extract ORLICA hero snippet' || true
          git push
