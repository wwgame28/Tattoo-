name: Wire ORLICA V9
on:
  push:
    paths:
      - 'orlica-v9.css'
      - 'orlica-v9.js'
      - 'admin-v9.css'
      - 'admin-v9.js'
      - '.github/workflows/orlica-v9-wire.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire V9 assets
        run: |
          python - <<'PY'
          from pathlib import Path
          def wire(path, css, js):
              p=Path(path); s=p.read_text(encoding='utf-8')
              css_tag=f'<link rel="stylesheet" href="{css}?v=9">'
              js_tag=f'<script defer src="{js}?v=9"></script>'
              if css_tag not in s:
                  s=s.replace('</head>',css_tag+'\n</head>')
              if js_tag not in s:
                  s=s.replace('</body>',js_tag+'\n</body>')
              p.write_text(s,encoding='utf-8')
          wire('index.html','orlica-v9.css','orlica-v9.js')
          wire('admin.html','admin-v9.css','admin-v9.js')
          PY
          git config user.name 'Danil Director Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html admin.html
          git diff --cached --quiet || git commit -m 'Wire ORLICA V9 booking tools'
          git push
