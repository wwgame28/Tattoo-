name: Bump ORLICA V8 assets
on:
  push:
    paths:
      - ".github/workflows/orlica-v8-cache.yml"
permissions:
  contents: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump V8 asset version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('orlica-v8.css?v=1', 'orlica-v8.css?v=2')
          s = s.replace('orlica-v8.js?v=1', 'orlica-v8.js?v=2')
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name "Danil Director Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Bump ORLICA V8 asset cache" || exit 0
          git push
