name: Fix swipe animations

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-swipe-animations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate scroll reveal animations
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          original = html

          # 1) Disable the older Motion scroll observer so headings/steps aren't animated twice.
          old_motion = """const observer=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){play(e.target,{y:[22,0]},{duration:.65});observer.unobserve(e.target)}}),{threshold:.15});
          document.querySelectorAll('.sectionhead,.step,.about h2,.booking h2').forEach(e=>observer.observe(e));"""
          html = html.replace(old_motion, "/* Scroll entrance handled by #scroll-entrances only. */", 1)

          # 2) Disable the older CSS reveal layer. A single observer below now controls entrances.
          old_reveal = "const revealEls=[...document.querySelectorAll('.manifesto-copy,.sectionhead,.card,.about .portrait,.about>div:last-child,.step,.faq details,.booking h2,.booking-grid')];"
          html = html.replace(old_reveal, "const revealEls=[];", 1)

          # 3) Keep ink interactions, but stop the ink-polish observer from animating the same headings/images.
          old_headings = "const headings=[...document.querySelectorAll('.sectionhead h2,.process>h2,.faq>h2,.booking>h2,.studio-intro h2')];"
          old_pictures = "const pictures=[...document.querySelectorAll('.about .portrait img,.card img')];"
          html = html.replace(old_headings, "const headings=[];", 1)
          html = html.replace(old_pictures, "const pictures=[];", 1)

          # 4) Replace the dedicated entrance script with one lightweight, one-shot reveal system.
          replacement = r'''<script id="scroll-entrances">
          /* Single one-shot entrance system. Optimized for touch scrolling: opacity + individual translate only. */
          (()=>{
            const reduce=matchMedia('(prefers-reduced-motion: reduce)');
            const disabled=()=>reduce.matches||document.body.classList.contains('motion-off');
            const selector='.manifesto-copy,.sectionhead,.card,.placeholder-card,.about .portrait,.about>div:last-child,.step,.faq>h2,.faq details,.smooth-faq-item,.booking h2,.booking-grid,.booking-grid>div,#brief,.client-review,.studio-intro,.studio-details,.visit-checklist>label,.sketch-request>div';
            const targets=[...new Set(document.querySelectorAll(selector))];
            const pending=new Set();
            const active=new Map();
            let observer=null;

            const clear=el=>{
              el.style.removeProperty('opacity');
              el.style.removeProperty('translate');
              el.style.removeProperty('will-change');
            };

            const finish=el=>{
              pending.delete(el);
              observer?.unobserve(el);
              const anim=active.get(el);
              if(anim){try{anim.cancel()}catch(_){ } active.delete(el)}
              clear(el);
            };

            const show=(el,delay=0)=>{
              if(!pending.has(el))return;
              pending.delete(el);
              observer?.unobserve(el);
              if(disabled()||!el.animate){clear(el);return}
              const anim=el.animate(
                [
                  {opacity:0,translate:'0 18px'},
                  {opacity:1,translate:'0 0'}
                ],
                {duration:680,delay,easing:'cubic-bezier(.16,1,.3,1)',fill:'both'}
              );
              active.set(el,anim);
              const done=()=>{active.delete(el);clear(el)};
              anim.onfinish=done;
              anim.oncancel=done;
            };

            const prepare=()=>{
              if(disabled()||!('IntersectionObserver' in window)){
                targets.forEach(clear);
                return;
              }
              observer=new IntersectionObserver(entries=>{
                let order=0;
                entries.forEach(entry=>{
                  if(entry.isIntersecting&&pending.has(entry.target)){
                    show(entry.target,Math.min(order++*45,135));
                  }
                });
              },{threshold:.08,rootMargin:'0px 0px -6% 0px'});

              targets.forEach(el=>{
                const rect=el.getBoundingClientRect();
                if(rect.bottom<=0||rect.top<innerHeight*.94){
                  clear(el);
                  return;
                }
                el.style.opacity='0';
                el.style.translate='0 18px';
                el.style.willChange='opacity, translate';
                pending.add(el);
                observer.observe(el);
              });
            };

            const settle=()=>{
              active.forEach((anim,el)=>{try{anim.cancel()}catch(_){ } clear(el)});
              active.clear();
              pending.forEach(clear);
              pending.clear();
              observer?.disconnect();
            };

            reduce.addEventListener('change',()=>{if(disabled())settle()});
            document.getElementById('motion')?.addEventListener('click',()=>{if(disabled())settle()});
            prepare();
          })();
          </script>'''

          html, count = re.subn(r'<script id="scroll-entrances">.*?</script>', replacement, html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('scroll-entrances block not found exactly once')

          if html == original:
              raise SystemExit('No changes made')

          path.write_text(html, encoding='utf-8')
          print('Patched index.html:', len(original), '->', len(html), 'bytes/chars')

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Smooth mobile swipe animations"
          git push
