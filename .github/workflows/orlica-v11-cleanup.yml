name: Build ORLICA V11 Cleanup
on:
  push:
    paths:
      - '.github/workflows/orlica-v11-cleanup.yml'
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consolidate site assets and polish UX
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          css_sources = [
            'director-v5.css','orlica-v7.css','orlica-v8.css','orlica-v81.css',
            'orlica-v9.css','orlica-v10.css','orlica-hero-hold.css',
            'orlica-hero-clean.css','orlica-v101.css'
          ]
          js_sources = [
            'director-v5.js','orlica-v7.js','orlica-v8.js','orlica-v9.js',
            'orlica-v10.js','orlica-hero-hold.js','orlica-v101.js'
          ]

          cleanup_css = r'''
/* ORLICA V11 — final cleanup */
