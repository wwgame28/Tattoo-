html.orlica-v11 .manifesto{background:linear-gradient(180deg,rgba(18,5,7,.78),rgba(5,3,3,.92))!important}
html.orlica-v11 #works{background:linear-gradient(180deg,#060303,#020202)!important}
html.orlica-v11 .about,html.orlica-v11 .process,html.orlica-v11 .faq{background:#020202!important}
html.orlica-v11 #book.orlica-booking-live{background:linear-gradient(180deg,#090405,#020202)!important}
html.orlica-v11 section{border-color:var(--v11-line)!important}
html.orlica-v11 .manifesto p,
html.orlica-v11 .about p,
html.orlica-v11 .process p,
html.orlica-v11 .faq p,
html.orlica-v11 .booking-live-head p{font-size:clamp(14px,1.15vw,17px)!important;line-height:1.6!important;color:var(--v11-muted)!important}

html.orlica-v11 .v101-board{background:linear-gradient(180deg,rgba(31,6,10,.62),rgba(3,2,2,.96))!important;border-color:var(--v11-line)!important}
