html.orlica-v11 .v101-notice{border-color:var(--v11-line)!important;background:rgba(255,255,255,.018)!important;box-shadow:none!important}

html.orlica-v11 #works .piece-media{border-color:rgba(255,255,255,.055)!important;box-shadow:0 16px 44px rgba(0,0,0,.28)!important}
html.orlica-v11 #works .piece-meta{background:transparent!important;border-color:var(--v11-line)!important;padding-top:9px!important;margin-top:8px!important}
html.orlica-v11 #works .piece-title{font-size:11px!important;letter-spacing:.05em!important}
html.orlica-v11 #works .piece-tag{font-size:8px!important;color:#766866!important}
html.orlica-v11 .works-channel{border-color:var(--v11-line)!important;padding-top:22px!important;padding-bottom:22px!important}

html.orlica-v11 .smooth-faq,html.orlica-v11 .smooth-faq-item{border-color:var(--v11-line)!important}
html.orlica-v11 .smooth-faq{background:transparent!important}
html.orlica-v11 .smooth-faq-item:has(.smooth-faq-trigger[aria-expanded="true"]){background:rgba(255,255,255,.025)!important}

html.orlica-v11 .booking-form-wrap{border-color:var(--v11-line)!important;background:rgba(255,255,255,.018)!important;box-shadow:none!important}
html.orlica-v11 .booking-calendar{border-color:var(--v11-line)!important}
html.orlica-v11 .v101-calendar-shell{border-color:var(--v11-line)!important;background:rgba(255,255,255,.012)!important}
html.orlica-v11 .v101-day{border-color:rgba(255,255,255,.05)!important;background:rgba(255,255,255,.01)!important}
html.orlica-v11 .v101-day.busy{color:#5e5052!important;opacity:.62}
html.orlica-v11 .v101-day.busy::after{background:rgba(146,42,56,.5)!important}
html.orlica-v11 .v101-day.open{color:#dcf8e6!important;border-color:rgba(98,213,138,.42)!important;background:rgba(98,213,138,.09)!important}
html.orlica-v11 .v101-day.open .num{color:var(--v11-green)!important}
html.orlica-v11 .v101-day.open.is-selected{background:rgba(98,213,138,.17)!important;border-color:var(--v11-green)!important}
