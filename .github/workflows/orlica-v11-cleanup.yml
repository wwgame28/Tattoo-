html.orlica-v11 .hero{min-height:auto!important;background:linear-gradient(180deg,rgba(94,8,20,.16),rgba(22,6,8,.12) 55%,rgba(0,0,0,0))!important;border-bottom:1px solid var(--v11-line)!important;padding-bottom:clamp(40px,6vw,70px)!important}
html.orlica-v11 .hero::before{opacity:.55!important}
html.orlica-v11 .hero-visual figcaption{display:none!important}
html.orlica-v11 #ink-portrait.ink-portrait{aspect-ratio:3/4!important;max-height:min(72svh,760px)!important;width:100%!important;border-color:rgba(255,205,208,.12)!important;border-radius:18px!important;box-shadow:0 24px 66px rgba(0,0,0,.42),0 0 70px rgba(137,8,25,.10)!important}
html.orlica-v11 #ink-portrait img{width:100%!important;height:100%!important;object-fit:cover!important;object-position:center 44%!important}
