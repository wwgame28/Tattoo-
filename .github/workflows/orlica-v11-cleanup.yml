html.orlica-v11 .booking-time.is-active{background:#c52139!important;border-color:#c52139!important}
html.orlica-v11 .booking-legal{font-size:10px!important;line-height:1.5!important;color:#8b7975!important}
html.orlica-v11 .booking-submit:not(:disabled){background:linear-gradient(135deg,#cf2039,#7d0f1b)!important}
html.orlica-v11 .booking-submit:disabled{background:#211a1b!important;color:#695c5e!important}

html.orlica-v11 .v101-studio-section,html.orlica-v11 .v101-studio-light{background:#050303!important;border-color:var(--v11-line)!important;box-shadow:none!important}
html.orlica-v11 .v101-scroll-row{padding-inline:0 18px!important}

html.orlica-v11 footer{background:#000!important;border-color:var(--v11-line)!important}

@media(max-width:800px){
  html.orlica-v11 .hero{padding-top:68px!important;padding-bottom:34px!important}
  html.orlica-v11 .hero-copy{gap:12px!important}
  html.orlica-v11 .hero-visual{margin-top:14px!important}
  html.orlica-v11 #ink-portrait.ink-portrait{max-height:68svh!important}
  html.orlica-v11 .hero-note{font-size:15px!important;line-height:1.56!important}
  html.orlica-v11 .hero-tags{margin-top:4px!important}
  html.orlica-v11 .ticker{padding:9px 0!important}
  html.orlica-v11 .ticker *{font-size:clamp(24px,8vw,42px)!important}
  html.orlica-v11 .manifesto p,html.orlica-v11 .about p,html.orlica-v11 .process p,html.orlica-v11 .faq p,html.orlica-v11 .booking-live-head p{font-size:15px!important}
  html.orlica-v11 .v101-board{padding:48px 18px!important}
  html.orlica-v11 .booking-form-wrap{padding:18px 14px!important}
}
@media(max-width:430px){
  html.orlica-v11 #ink-portrait.ink-portrait{max-height:64svh!important;border-radius:15px!important}
  html.orlica-v11 .hero h1{font-size:clamp(52px,17vw,72px)!important;line-height:.86!important}
  html.orlica-v11 .hero-note{font-size:14px!important;max-width:29ch!important}
  html.orlica-v11 .hero-tags span{font-size:8px!important;padding:7px 9px!important}
  html.orlica-v11 .hero .cta{min-height:56px!important;padding:15px 18px!important}
  html.orlica-v11 .v101-day{min-height:47px!important}
  html.orlica-v11 .v101-day .num{font-size:18px!important}
  html.orlica-v11 .v101-day .mini{font-size:6px!important}
}
@media(prefers-reduced-motion:reduce){html.orlica-v11 *{scroll-behavior:auto!important}}
'''

          cleanup_js = r'''
/* ORLICA V11 — final cleanup runtime */
(() => {
  document.documentElement.classList.add('orlica-v11');

  const isCompare = v => {
    const t = String(v || '').replace(/\s+/g,' ').trim().toLowerCase();
    return t.includes('сравнить до') || t.includes('до / после') || t.includes('до/после');
  };

  function cleanHero(){
    const hero = document.querySelector('.hero');
    if(!hero) return;
    hero.querySelectorAll('a,button,[role="button"],span,p,div').forEach(el => {
      if(el.children.length===0 && isCompare(el.textContent)) el.remove();
    });
    hero.querySelector('.hero-visual figcaption')?.remove();
    const visual = hero.querySelector('.hero-visual');
    if(visual && !visual.querySelector('.v10-hold-note')){
      const note = document.createElement('div');
      note.className='v10-hold-note';
      note.innerHTML='<span></span> удерживай фото';
      visual.append(note);
    }
  }

  function syncBoard(){
    const board = document.querySelector('.v101-board');
    if(!board) return;
    const empty = !!board.querySelector('.v101-board-empty');
    board.hidden = empty;
    board.style.display = empty ? 'none' : '';
  }

  function polishTicker(){
    const ticker = document.querySelector('.ticker');
    if(!ticker) return;
    ticker.querySelectorAll('*').forEach(el => {
      const cs = getComputedStyle(el);
      if(cs.animationName && cs.animationName !== 'none') el.style.animationDuration='34s';
    });
  }

  function boot(){
    cleanHero();
    syncBoard();
    polishTicker();
    const mo = new MutationObserver(() => { cleanHero(); syncBoard(); });
    mo.observe(document.body,{childList:true,subtree:true});
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot,{once:true});
  else boot();
})();
'''

          css = ['/* ORLICA V11 consolidated bundle */']
          for name in css_sources:
            p=Path(name)
            if p.exists(): css += [f'\n/* source: {name} */\n',p.read_text(encoding='utf-8')]
          css.append(cleanup_css)
          Path('orlica-v11.css').write_text('\n'.join(css),encoding='utf-8')

          js = ['/* ORLICA V11 consolidated runtime */']
          for name in js_sources:
            p=Path(name)
            if p.exists(): js += [f'\n/* source: {name} */\n',p.read_text(encoding='utf-8')]
          js.append(cleanup_js)
          Path('orlica-v11.js').write_text('\n'.join(js),encoding='utf-8')

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          names = r'(?:director-v5|orlica-(?:v7|v8|v81|v9|v10|v101|hero-clean|hero-hold))'
          s=re.sub(r'<link[^>]+href=["\'][^"\']*'+names+r'\.css(?:\?[^"\']*)?["\'][^>]*>\s*','',s,flags=re.I)
          s=re.sub(r'<script[^>]+src=["\'][^"\']*'+names+r'\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
          s=re.sub(r'<link[^>]+href=["\'][^"\']*orlica-v11\.css(?:\?[^"\']*)?["\'][^>]*>\s*','',s,flags=re.I)
          s=re.sub(r'<script[^>]+src=["\'][^"\']*orlica-v11\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*','',s,flags=re.I)
          s=s.replace('</head>','<link rel="stylesheet" href="orlica-v11.css?v=1100"></head>')
          s=s.replace('</body>','<script defer src="orlica-v11.js?v=1100"></script></body>')
          p.write_text(s,encoding='utf-8')

          for name in css_sources + js_sources:
            Path(name).unlink(missing_ok=True)
          PY
          git config user.name "Danil Director Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "ORLICA V11 cleanup and consolidation"
          git push
